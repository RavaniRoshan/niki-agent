<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Niki Agent — a terminal coding agent that stays quiet</title>
    <meta name="description" content="Niki Agent reads your repository, edits files, and runs commands with an approval gate in front of every change. One native binary, eleven providers, sessions on your disk, no account, no telemetry." />
    <meta property="og:title" content="Niki Agent — a terminal coding agent that stays quiet" />
    <meta property="og:description" content="An approval card in front of every write and command. One native binary, eleven providers, sessions on your disk. No account, no telemetry, no subscription." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Niki Agent — a terminal coding agent that stays quiet" />
    <meta name="twitter:description" content="An approval card in front of every write and command. One native binary, eleven providers, sessions on your disk. No account, no telemetry, no subscription." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..600&family=Geist:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('niki-color-mode');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else if (saved === 'system') {
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.classList.toggle('dark', prefersDark);
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-chart-2/25 selection:text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
