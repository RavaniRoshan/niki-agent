niki-engine-client = { path = "../niki-engine-client" }
niki-mcp = { path = "../niki-mcp" }
niki-policy = { path = "../niki-policy" }
niki-proto = { path = "../niki-proto" }
niki-provider = { path = "../niki-provider" }
niki-render = { path = "../niki-render" }
niki-skills = { path = "../niki-skills" }
niki-tools = { path = "../niki-tools" }
niki-tui = { path = "../niki-tui" }
niki-tui-live = { path = "../niki-tui-live" }
niki-tui-themes = { path = "../niki-tui-themes" }
tokio.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
