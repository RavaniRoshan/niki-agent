name: "\U0001F512 Privileged"
description: You are a Niki Agent maintainer. If not, check the other options.
body:
  - type: markdown
    attributes:
      value: |
        > **All contributions must be in English.**

        If you are not a Niki Agent maintainer, employee, or were not asked directly by a maintainer to create an issue, then please use the bug report or feature request form instead.

        **Note:** Do not begin work on a PR unless explicitly assigned to this issue by a maintainer.
  - type: checkboxes
    id: privileged
    attributes:
      label: Privileged issue
      description: Confirm that you are allowed to create an issue here.
      options:
        - label: I am a Niki Agent maintainer.
          required: true
  - type: textarea
    id: content
    attributes:
      label: Issue Content
      description: Add the content of the issue here.
  - type: checkboxes
    id: area
    attributes:
      label: Area (Required)
      description: |
        Please select area(s) that this issue is related to.
      options:
        - label: TUI / composer / keymap
        - label: Headless mode (`-n`)
        - label: Sessions and state (`~/.niki`)
        - label: Providers and authentication
        - label: MCP
        - label: Skills / plugins / subagents
        - label: Sandboxes
        - label: Rust client (`rust/`)
        - label: Installer / release artifacts
        - label: Documentation
        - label: Other / not sure / general
  - type: markdown
    attributes:
      value: |
        Please do not begin work on a PR unless explicitly assigned to this issue by a maintainer.
