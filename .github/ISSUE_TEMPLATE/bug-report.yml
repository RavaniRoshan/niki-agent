name: "\U0001F41B Bug Report"
description: Report a bug in Niki Agent. To report a security issue, use the security advisory link below instead.
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        > **All contributions must be in English.**

        Thank you for taking the time to file a bug report.

        For usage questions, please open a discussion or ask in an existing issue.

        Check these before submitting to see if your issue has already been reported or fixed:

        * [README](https://github.com/RavaniRoshan/niki-agent#readme),
        * [Documentation](https://github.com/RavaniRoshan/niki-agent/tree/niki-agent/docs/niki),
        * [GitHub search](https://github.com/RavaniRoshan/niki-agent/issues),
        * [Security advisories](https://github.com/RavaniRoshan/niki-agent/security/advisories/new) for anything with a security impact.

        **Note:** For bug fixes, please feel free to open a PR contributing a failing test. However, please do not begin to work on a fix unless explicitly assigned to this issue by a maintainer.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checklist
      description: Please confirm the following.
      options:
        - label: This is a bug, not a usage question.
          required: true
        - label: I added a clear and descriptive title.
          required: true
        - label: I searched existing issues and didn't find this.
          required: true
        - label: I can reproduce this with the latest released version.
          required: true
        - label: I included a minimal reproducible example and steps to reproduce.
          required: true
  - type: checkboxes
    id: area
    attributes:
      label: Area (Required)
      description: Which part of the product does this issue relate to? Select at least one.
      options:
        - label: TUI / composer / keymap
        - label: Headless mode (`-n`)
        - label: Sessions and state (`~/.niki`)
        - label: Providers and authentication
        - label: MCP
        - label: Skills / plugins / subagents
        - label: Sandboxes
        - label: Rust client (`rust/`)
        - label: Installer / release artifacts
        - label: Documentation
        - label: Other / not sure / general
  - type: textarea
    id: related
    validations:
      required: false
    attributes:
      label: Related Issues / PRs
      description: |
        If this bug is related to any existing issues or pull requests, please link them here.
      placeholder: |
        * e.g. #123, #456
  - type: textarea
    id: reproduction
    validations:
      required: true
    attributes:
      label: Reproduction Steps / Example Code
      description: |
        Please add a self-contained, [minimal, reproducible example](https://stackoverflow.com/help/minimal-reproducible-example) with your use case.

        If a maintainer can copy it, run it, and see it right away, there's a much higher chance that you'll be able to get help.

        **Important!**

        * Avoid screenshots, as they are hard to read and (more importantly) don't allow others to copy-and-paste your code.
        * Reduce your steps to the minimum required to reproduce the issue if possible.
        * For anything that happens in the TUI, include the request you typed and the approval mode you were in.

        (This will be automatically formatted into code, so no need for backticks.)
      render: shell
  - type: textarea
    id: error
    attributes:
      label: Error Message and Stack Trace (if applicable)
      description: |
        If you are reporting an error, please copy and paste the full error message and
        stack trace.
        (This will be automatically formatted into code, so no need for backticks.)
      render: shell
  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        What is the problem, question, or error?

        Write a short description telling what you are doing, what you expect to happen, and what is currently happening.
      placeholder: |
        * I'm trying to use Niki Agent to do X.
        * I expect to see Y.
        * Instead, it does Z.
    validations:
      required: true
  - type: textarea
    id: system-info
    attributes:
      label: Environment / System Info
      description: Provide OS, Python version, the version printed by `niki --version`, and any relevant env vars.
      placeholder: |
        OS:
        Python: 3.x.x
        niki: 1.x.y
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Niki Agent.
