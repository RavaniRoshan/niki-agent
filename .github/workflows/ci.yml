# Niki Agent CI.
#
# The product is the Rust workspace in `rust/`: tests, formatting, and clippy
# at deny-warnings. The aggregate **✅ CI Success** check is what branch
# protection requires.

name: "🔧 CI"

on:
  push:
    branches: [niki-agent]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: "🦀 rust client"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "📋 Checkout Code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "🦀 Install the Rust toolchain"
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt,clippy
          rustup default stable

      - name: "📦 Cache the cargo registry and target dir"
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: "🧪 cargo test"
        working-directory: rust
        run: cargo test -j 4 --workspace --locked

      - name: "🎨 cargo fmt"
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: "🔍 cargo clippy"
        working-directory: rust
        run: cargo clippy -j 4 --workspace --all-targets --locked -- -D warnings

  ci_success:
    name: "✅ CI Success"
    needs: [rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "Aggregate result"
        env:
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          if [ "$RUST_RESULT" != "success" ]; then
            echo "rust client finished as '$RUST_RESULT'"
            exit 1
          fi
          echo "the rust client passed"
