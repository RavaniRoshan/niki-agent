# Documentation site.
#
# `docs-site` is a VitePress project at the repository root, deployed as its own
# Vercel project. The brand gate runs before the build: it fails on a stale
# mirror of a repository document, and on any page or built asset that names
# another agent project or claims an affiliation. Nothing here needs a secret.

name: "📚 Docs site"

on:
  push:
    branches: [niki-agent]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docs:
    name: "📚 docs site"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "📋 Checkout Code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "🟢 Set up Node"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: "📦 Install"
        working-directory: docs-site
        run: npm ci --no-audit --no-fund

      - name: "🏷 Check brand"
        working-directory: docs-site
        run: npm run check:brand

      - name: "🏗 Build"
        working-directory: docs-site
        run: npm run build
